<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agenda</title>
<style>
:root { --ink:#F5F5F5; --muted:#A1A1AA; --line:#2C2C2E; --bg:#111111; --card:#1C1C1E; --blue:#4F7DFF; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
body { -webkit-text-size-adjust:100%; }
#app { height:100dvh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; }
input, textarea, select { font:inherit; color:var(--ink); }
.top { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px 0 20px; min-height:52px; }
.title { font-size:24px; font-weight:700; }
.sub { font-size:12px; color:var(--muted); padding:0 20px; }
.main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.tabs { display:grid; grid-template-columns:repeat(4,1fr); background:#fff; box-shadow:inset 0 1px 0 var(--line); padding-bottom:env(safe-area-inset-bottom); }
.tabs button { height:60px; font-size:13px; font-weight:600; color:var(--muted); }
.tabs button.on { color:var(--ink); font-weight:700; box-shadow:inset 0 3px 0 var(--ink); }
.iconbtn { width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:22px; }
.pill { font-size:11px; font-weight:700; border-radius:999px; padding:5px 10px; white-space:nowrap; }
.pill.off { background:#FEF3C7; color:#92400E; } .pill.ok { background:#DCFCE7; color:#14532D; } .pill.run { background:#E0E7FF; color:#312E81; } .pill.auth { background:#FEE2E2; color:#7F1D1D; }
.lab { font-size:12px; font-weight:700; color:#374151; letter-spacing:.04em; margin:0 0 8px; }
.sec { padding:14px 20px 0; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { height:44px; padding:0 16px; border-radius:22px; font-size:14px; font-weight:600; background:#fff; box-shadow:inset 0 0 0 1px #9CA3AF; }
.chip.on { color:#fff; box-shadow:none; }
.card { background:#fff; border-radius:10px; box-shadow:inset 0 0 0 1px var(--line); }
.item { display:flex; gap:12px; align-items:center; padding:8px 12px; min-height:52px; width:100%; text-align:left; }
.item + .item { margin-top:6px; }
.item .t { width:44px; font-size:13px; font-weight:700; flex:none; }
.item .b { flex:1; min-width:0; } .item .b div:first-child { font-size:14px; font-weight:600; } .item .b div + div { font-size:12px; color:var(--muted); }
.tag { font-size:10px; font-weight:700; color:#312E81; background:#E0E7FF; border-radius:999px; padding:2px 8px; }
.btn { height:46px; border-radius:10px; font-size:15px; font-weight:600; padding:0 16px; box-shadow:inset 0 0 0 1px #9CA3AF; background:transparent; width:100%; }
.btn.pri { background:var(--ink); color:#fff; box-shadow:none; font-weight:700; }
.btn.warn { color:#991B1B; box-shadow:inset 0 0 0 1px #FCA5A5; }
.field { margin-bottom:12px; } .field label { display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:4px; }
.inp { width:100%; height:44px; border-radius:10px; background:#fff; border:0; box-shadow:inset 0 0 0 1px #9CA3AF; padding:0 12px; font-size:16px; }
textarea.inp { height:84px; padding:10px 12px; resize:none; }
.row2 { display:flex; gap:8px; } .row2 > * { flex:1; min-width:0; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; padding:12px 20px 4px; }
.lg { display:flex; align-items:center; gap:4px; font-size:11px; white-space:nowrap; }
.lgb { min-width:16px; height:16px; padding:0 3px; border-radius:4px; color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; }
/* mois */
.m7.w8, .wk.w8 { grid-template-columns:20px repeat(7,minmax(0,1fr)); } .wn { display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; color:#9CA3AF; }
.m7 { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; padding:0 16px; }
.mc { position:relative; height:52px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; background:#fff; box-shadow:inset 0 0 0 1px var(--line); }
.mc b { font-size:14px; font-weight:600; } .mc span { font-size:9px; font-weight:700; min-height:12px; } .mc span.lbl { font-size:7px; line-height:1; text-align:center; }
.permbox { margin-top:10px; background:#fff; border-radius:12px; box-shadow:inset 0 0 0 1px var(--line); padding:6px 14px 10px; } .pc { display:flex; align-items:center; gap:12px; min-height:46px; font-size:15px; } .pc input { width:22px; height:22px; flex:none; } .pc span { flex:1; } .pb { font-style:normal; font-size:12px; font-weight:700; border-radius:6px; padding:5px 10px; min-width:44px; text-align:center; }
.mc.we { background:#E5E7EB; box-shadow:none; color:#374151; }
.mc.sel { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.dot { position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:3px; background:#111827; }
.dot.loc { background:transparent; box-shadow:inset 0 0 0 1.5px #6B7280; }
.cat { box-shadow:none; }  .cat[style*='FFFFFF'] { box-shadow:inset 0 0 0 1px #9CA3AF; }
.cat .dot { background:#fff; } .cat .dot.loc { background:transparent; box-shadow:inset 0 0 0 1.5px #fff; }
.wk { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:8px 16px 6px; text-align:center; font-size:11px; font-weight:600; color:var(--muted); }
/* année */
.yscroll { overflow:auto; padding:0 8px 8px 8px; }
.ygrid { display:grid; grid-template-columns:34px repeat(31, minmax(21px, 1fr)); gap:2px; width:100%; min-width:760px; align-items:center; }
.yh { font-size:9px; text-align:center; color:var(--muted); height:18px; }
.ym { font-size:10px; font-weight:700; color:#374151; position:sticky; left:0; background:var(--bg); z-index:2; height:28px; display:flex; align-items:center; }
.yc { position:relative; height:28px; border-radius:4px; font-size:10px; font-weight:700; background:#fff; box-shadow:inset 0 0 0 1px var(--line); display:flex; align-items:center; justify-content:center; padding:0; }
.yc.we { background:#E5E7EB; box-shadow:none; } .yc.sel { box-shadow:0 0 0 2px #111827; } .yc.none { visibility:hidden; }
.yc .dot { top:2px; right:2px; width:5px; height:5px; }
.yc.long { font-size:8px; }
/* verrouillage */
.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 36px; gap:0; text-align:center; }
.logo { width:76px; height:76px; border-radius:19px; background:#111827; display:flex; align-items:center; justify-content:center; }
.center h1 { font-size:24px; margin:16px 0 4px; } .center p { font-size:13px; color:var(--muted); margin:0 0 22px; line-height:1.45; }
.center .inp, .center .btn { max-width:340px; margin-bottom:12px; }
.link { font-size:13px; font-weight:600; color:var(--blue); padding:10px; }
.err { color:#991B1B; font-size:13px; min-height:18px; margin-bottom:6px; }
.code { font-family:ui-monospace, Menlo, monospace; font-size:20px; font-weight:700; letter-spacing:1px; background:#fff; border-radius:10px; box-shadow:inset 0 0 0 1px #9CA3AF; padding:14px 12px; margin-bottom:14px; word-break:break-all; }
.toast { position:fixed; left:16px; right:16px; bottom:calc(76px + env(safe-area-inset-bottom)); background:#111827; color:#fff; border-radius:10px; padding:12px 14px; font-size:13px; z-index:20; }
.banner { margin:10px 20px 0; padding:10px 12px; border-radius:10px; background:#FEF9C3; color:#713F12; font-size:13px; font-weight:600; }
.set { padding:14px 20px 0; } .set h3 { margin:0 0 8px; font-size:13px; letter-spacing:.04em; color:#374151; }
.sp { height:10px; }
@media (orientation:landscape) and (max-height:520px) {
  .yc, .ym { height:19px; } .yh { height:14px; } .yc { font-size:9px; } .yc.long { font-size:7px; }
  .top { min-height:40px; } .title { font-size:20px; } .legend { padding:2px 20px; } .tabs button { height:40px; }
  .iconbtn { height:36px; } #app .sub { display:none; }
}
@media (max-width:520px) {
  .top { flex-wrap:wrap; } .top .title { white-space:nowrap; flex:1; }
  .top > .pw { order:5; flex-basis:100%; text-align:right; padding:0 8px 2px 0; }
}

/* ===== Design 2.0 : noir tricolore ===== */
#app::before { content:''; flex:none; height:5px; background:linear-gradient(90deg,#1D4ED8 0 33.33%,#FFFFFF 33.33% 66.66%,#DC2626 66.66% 100%); }
.top { padding-top:14px; } .title { font-size:28px; font-weight:700; letter-spacing:-.01em; }
.iconbtn { background:var(--card); box-shadow:inset 0 0 0 1px var(--line); border-radius:14px; }
.tabs { display:flex; gap:4px; margin:6px 16px calc(12px + env(safe-area-inset-bottom)); padding:5px; background:#2C2C2E; border-radius:32px; box-shadow:none; }
.tabs button { flex:1; height:50px; border-radius:26px; font-size:13px; color:var(--muted); }
.tabs button.on { background:var(--blue); color:#fff; box-shadow:none; }
.toast { bottom:calc(92px + env(safe-area-inset-bottom)); background:#2C2C2E; }
.card, .permbox, .chip, .mc, .yc, .inp, .code, .logo { background:var(--card); }
.card, .permbox, .mc, .yc { box-shadow:inset 0 0 0 1px var(--line); }
.mc { border-radius:12px; height:54px; } .yc { border-radius:5px; }
.mc.we, .yc.we { background:#26262A; color:var(--muted); box-shadow:none; }
.mc.sel { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--blue); } .yc.sel { box-shadow:0 0 0 2px var(--blue); }
.chip { box-shadow:inset 0 0 0 1px #52525B; } .chip.on { box-shadow:none; }
.inp, .code { box-shadow:inset 0 0 0 1px #52525B; color:var(--ink); } .inp::placeholder { color:#71717A; }
.btn { box-shadow:inset 0 0 0 1px #52525B; } .btn.pri { background:var(--blue); color:#fff; } .btn.warn { color:#FCA5A5; box-shadow:inset 0 0 0 1px #7F1D1D; }
.lab, .set h3 { color:var(--muted); } .wn { color:#71717A; }
.dot { background:#F5F5F5; } .cat .dot { background:#fff; }
.cat[style*='FFFFFF'] { box-shadow:none; } .cat[style*='FFFFFF'] .dot { background:#111; } .cat[style*='FFFFFF'] .dot.loc { box-shadow:inset 0 0 0 1.5px #111; }
.pill.off { background:#451A03; color:#FCD34D; } .pill.ok { background:#14532D; color:#DCFCE7; } .pill.run { background:#1E1B4B; color:#C7D2FE; } .pill.auth { background:#450A0A; color:#FECACA; }
.tag { background:#1E1B4B; color:#C7D2FE; }
.banner { background:#422006; color:#FDE68A; }
.logo { box-shadow:inset 0 0 0 1px #3F3F46; } .logo::after { content:''; position:absolute; }
.center h1 { font-size:28px; }
.link { color:#8FB0FF; } .err { color:#FCA5A5; }
select, textarea { background:var(--card); color:var(--ink); }

.logo { overflow:hidden; border-radius:19px; box-shadow:none; background:none; } .logo img { display:block; }
.lock { flex:1; display:flex; flex-direction:column; background:#000; margin-top:-5px; }
.hero { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
.flag { position:absolute; inset:0; display:flex; } .flag i { flex:1; } .flag i:nth-child(1){background:#1D4ED8} .flag i:nth-child(2){background:#fff} .flag i:nth-child(3){background:#DC2626}
.shade { position:absolute; inset:0; background:linear-gradient(rgba(0,0,0,.62),#000 88%); }
.brand { position:relative; display:flex; flex-direction:column; align-items:center; margin-top:-30px; }
.brand img { border-radius:24px; } .brand h1 { font-size:34px; font-weight:800; margin:16px 0 4px; letter-spacing:-.02em; } .brand p { margin:0; font-size:13px; color:#D4D4D8; }
.sheet { background:#111; border-radius:30px 30px 0 0; padding:24px 24px calc(30px + env(safe-area-inset-bottom)); box-shadow:0 -1px 0 #2C2C2E; display:flex; flex-direction:column; }
.sheet .inp { height:52px; border-radius:14px; margin-bottom:12px; } .sheet .btn { height:52px; border-radius:14px; } .sheet .link { align-self:center; margin-top:6px; }
.sheet .note { font-size:12px; color:var(--muted); text-align:center; margin:6px 0 0; }

.hd { padding:14px 20px 4px; } .hd1 { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:26px; }
.eyebrow { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.hd2 { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-top:4px; }
.hd2 .title { font-size:32px; line-height:1.08; letter-spacing:-.02em; font-weight:700; min-width:0; } .acc { color:var(--blue); }
.hbtn { display:flex; gap:6px; flex:none; align-items:center; }
.calcard { margin:12px 14px 0; background:var(--card); border-radius:26px; box-shadow:inset 0 0 0 1px var(--line); padding:12px 4px 10px; }
.calcard .wk { padding:0 10px 6px; } .calcard .m7 { padding:0 10px; gap:3px; row-gap:4px; }
.calcard .mc { background:transparent; box-shadow:none; height:50px; border-radius:12px; } .calcard .mc.we { background:transparent; color:var(--muted); } .calcard .mc.cat { box-shadow:none; }
.calcard .mc.sel { box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--blue); }
.dayh { display:flex; justify-content:space-between; align-items:baseline; padding:18px 22px 4px; } .dayh b { font-size:18px; } .dayh span { font-size:12px; color:var(--muted); }
.tl { padding:6px 14px 0; display:flex; flex-direction:column; gap:8px; }
.ev { display:flex; gap:10px; align-items:stretch; } .evt { width:44px; flex:none; text-align:right; font-size:12px; font-weight:600; color:var(--muted); padding-top:13px; }
.evc { flex:1; min-width:0; border-radius:18px; padding:11px 14px; } .evh { font-size:15px; font-weight:700; } .evs { font-size:12px; opacity:.88; margin-top:2px; }
.tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding-top:10px; } .tile { background:var(--card); border-radius:20px; box-shadow:inset 0 0 0 1px var(--line); padding:12px; } .tn { font-size:28px; font-weight:700; line-height:1.1; } .tl2 { font-size:11px; color:var(--muted); margin-top:3px; }
.track { height:10px; border-radius:6px; background:#2C2C2E; margin-top:12px; overflow:hidden; } .track div { height:100%; border-radius:6px; background:var(--blue); }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
